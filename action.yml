name: "skill-safe"
description: "Scan AI agent skills, plugins, and MCP configs for security risks and upload results to GitHub code scanning."
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "File or directory to scan."
    required: false
    default: "."
  fail-on:
    description: "Fail the job at this severity or worse: critical | high | medium | low | never."
    required: false
    default: "high"
  format:
    description: "Report format written to output-file: sarif | json | markdown."
    required: false
    default: "sarif"
  output-file:
    description: "Where to write the report."
    required: false
    default: "skill-safe.sarif"
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning (requires security-events: write)."
    required: false
    default: "true"
  version:
    description: "npm version/tag of skill-safe to run."
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Run skill-safe
      shell: bash
      run: |
        set -euo pipefail
        npx --yes skill-safe@${{ inputs.version }} "${{ inputs.path }}" \
          --format "${{ inputs.format }}" \
          --output "${{ inputs.output-file }}" \
          --fail-on never
        # Always show a human-readable summary in the job log.
        npx --yes skill-safe@${{ inputs.version }} "${{ inputs.path }}" \
          --format markdown --fail-on never >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' && inputs.format == 'sarif' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.output-file }}

    - name: Enforce threshold
      shell: bash
      run: |
        set -euo pipefail
        npx --yes skill-safe@${{ inputs.version }} "${{ inputs.path }}" \
          --format terminal --fail-on "${{ inputs.fail-on }}"
