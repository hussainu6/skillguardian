# Copy this into .github/workflows/skillguardian.yml in any repo that ships
# AI agent skills, plugins, or MCP configs.
name: skillguardian

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload results to the Security tab
    steps:
      - uses: actions/checkout@v5
      - uses: hussainu6/skillguardian@v0
        with:
          path: .
          fail-on: high
